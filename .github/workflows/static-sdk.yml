name: Chromium Base SDK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Chromium 버전에 맞춰 정식 SDK 릴리스 게시'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sdk:
    name: SDK / ${{ matrix.platform }} / ${{ matrix.linkage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x64, linkage: static, runner: windows-2025}
          - {platform: windows-x64, linkage: shared, runner: windows-2025}
          - {platform: linux-x64, linkage: static, runner: ubuntu-24.04}
          - {platform: linux-x64, linkage: shared, runner: ubuntu-24.04}
          - {platform: macos-arm64, linkage: static, runner: macos-26}
          - {platform: macos-arm64, linkage: shared, runner: macos-26}
    runs-on: ${{ matrix.runner }}
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows SDK and debugging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}/Windows Kits/10"
          if ((Test-Path "$kits/Include/10.0.28000.0/um/Windows.h") -and
              (Test-Path "$kits/Debuggers/x64/dbghelp.dll") -and
              (Test-Path "$kits/Lib/10.0.28000.0/um/x64/kernel32.lib")) { exit 0 }
          $installer = Join-Path $env:RUNNER_TEMP winsdksetup.exe
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2372508' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid SDK installer signature' }
          $p = Start-Process $installer -ArgumentList '/quiet /norestart /features OptionId.DesktopCPPx64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP' -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "Windows SDK setup failed ($($p.ExitCode))" }

      - name: Build and export Windows SDK
        if: runner.os == 'Windows'
        shell: bash
        env:
          LINKAGE: ${{ matrix.linkage }}
        run: |
          set -euo pipefail
          python base/scripts/sync_source.py
          python base/scripts/sync_tools.py gn ninja rust-toolchain chromium-llvm
          output=vendor/chromium/out/s
          if [[ "$LINKAGE" == shared ]]; then output=vendor/chromium/out/sh; fi
          python base/scripts/chromium_base.py configure --toolchain chromium --linkage "$LINKAGE" --output-dir "$output"
          python base/scripts/chromium_base.py build --toolchain chromium --linkage "$LINKAGE" --output-dir "$output"
          python base/scripts/export_sdk.py --toolchain chromium --linkage "$LINKAGE" --build-dir "$output" --destination "out/$LINKAGE-sdk"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libcap-dev

      - name: Build and export Unix SDK
        if: runner.os != 'Windows'
        run: python base/scripts/build_posix_sdk.py --linkage ${{ matrix.linkage }}

      - name: Read release tag from the built Chromium source
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("vendor/chromium" if os.name == "nt" else "out/native/src")
          fields = dict(line.split("=", 1) for line in (source / "chrome/VERSION").read_text().splitlines())
          parts = [fields[key] for key in ("MAJOR", "MINOR", "BUILD", "PATCH")]
          if not all(re.fullmatch(r"[0-9]+", part) for part in parts):
              raise SystemExit("Invalid Chromium chrome/VERSION")
          tag = "v" + ".".join(parts)
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit(f"Git tag {os.environ['GITHUB_REF_NAME']} does not match Chromium {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)

      - name: Archive SDK and test relocated CMake consumer
        run: python base/scripts/package_sdk.py ${{ matrix.platform }} --linkage ${{ matrix.linkage }}

      - uses: actions/upload-artifact@v4
        with:
          name: chromium-base-${{ matrix.linkage }}-${{ matrix.platform }}
          path: out/release/chromium-base-${{ matrix.platform }}-${{ matrix.linkage }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' || inputs.publish
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: chromium-base-*
          path: assets
          merge-multiple: true
      - name: Publish verified SDKs
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sdk.outputs.release_tag }}
        run: |
          set -euo pipefail
          files=(chromium-base-{windows-x64,linux-x64,macos-arm64}-{static,shared}.zip)
          sha256sum "${files[@]}" > SHA256SUMS
          tag_ref="refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "$tag_ref"; then
            if [[ $(git rev-parse "$tag_ref^{commit}") != "$(git rev-parse HEAD)" ]]; then
              echo "::error::$RELEASE_TAG already points to a different commit"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git push origin "HEAD:$tag_ref"
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Chromium Base SDK $RELEASE_TAG" --generate-notes "${files[@]}" SHA256SUMS
